name: Build NEULOX Android APK

on:
  push:
    branches: [main]
    paths:
      - 'NEULOX_AI_Project_v2.zip.b64'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compile NEULOX AI APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore Android project archive
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode NEULOX_AI_Project_v2.zip.b64 > /tmp/neulox-project.zip
          unzip -t /tmp/neulox-project.zip
          mkdir -p /tmp/neulox-project
          unzip -q /tmp/neulox-project.zip -d /tmp/neulox-project
          test -f /tmp/neulox-project/NEULOX_AI/settings.gradle.kts
          test -f /tmp/neulox-project/NEULOX_AI/app/src/main/java/com/neulox/ai/MainActivity.kt

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: /tmp/neulox-project/NEULOX_AI
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEULOX-AI-APK
          path: /tmp/neulox-project/NEULOX_AI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
